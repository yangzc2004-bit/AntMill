  \ \u2192 400 `INVALID_ENV`.\n- `files` optional, default `{}`. Must be `dict[str,\
  \ str]`; reject non-dict or non-string keys/values \u2192 400 `INVALID_FILES`.\n\
  - `stdin` optional, default `\"\"`. Accept string or list of strings; if list, join\
  \ with `\"\\n\"`. Non-string/non-list or list containing non-strings \u2192 400\
  \ `INVALID_STDIN`.\n- `timeout` optional, default `10`. Must be numeric `> 0` (exclude\
  \ bool). Invalid \u2192 400 `INVALID_TIMEOUT`.\n- `track` optional, default `[]`\
  \ (absent treated as `[]`). Must be list of strings; reject non-list or non-string\
  \ elements \u2192 400 `INVALID_TRACK`. Empty list `[]` is valid but treated same\
  \ as absent (omit `files` from response).\n- Generate per-run `id` via `uuid.uuid4()`.\n\
  - Working directory: `tempfile.TemporaryDirectory()`.\n  - Write each `files` entry\
  \ relative to tmpdir. Create parent subdirectories with `os.makedirs(..., exist_ok=True)`.\n\
  \  - Write with `encoding=\"utf-8\"`.\n- Environment: start from `os.environ.copy()`,\
  \ then `update(env)`.\n- Execution:\n  - `subprocess.Popen(command, shell=True,\
  \ cwd=tmpdir, env=run_env, stdin=PIPE, stdout=PIPE, stderr=PIPE, text=True, start_new_session=True)`.\n\
  \  - `proc.communicate(input=stdin, timeout=timeout)`.\n  - On `subprocess.TimeoutExpired`:\n\
  \    - `timed_out = True`.\n    - `exit_code = -1`.\n    - Kill entire process tree:\
  \ get pgid via `os.getpgid(proc.pid)`, `os.killpg(pgid, signal.SIGKILL)`. Fallback\
  \ to `proc.kill()` if pgid fails. Wrap in try/except for `ProcessLookupError`/`OSError`.\n\
  \  - Capture `stdout_data`, `stderr_data` as strings.\n- Duration: `time.time()`\
  \ before `Popen` and after completion/kill. Compute `duration = end - start`.\n\
  - Append raw (unrounded) duration to `execution_stats` for stats computation.\n\
  - Track output files (if `track` present and non-empty):\n  - Resolve each glob\
  \ pattern using `glob.glob(pattern, root_dir=tmpdir)` (POSIX globs relative to tmpdir).\n\
  \  - Deduplicate across multiple globs: maintain a set of seen relative paths.\n\
  \  - For each matched path: if it is a file (not directory), read with `open(...,\
  \ \"r\", encoding=\"utf-8\")` and store in result dict with relative path as key.\n\
  \  - Skip directories silently; skip unreadable files gracefully (continue without\
  \ error).\n  - Result `files` dict uses forward-slash relative paths (natural from\
  \ `glob` on POSIX; on Windows normalize via `os.path.asposix` or equivalent to ensure\
  \ consistency).\n  - Include `files: {...}` in response only when `track` was provided\
  \ and non-empty. Empty matches \u2192 `files: {}`.\n- Round `duration` in response\
  \ to 3 decimal places using `round(value, 3)`.\n- Return 201 JSON with fields: `id`,\
  \ `stdout`, `stderr`, `exit_code`, `duration`, `timed_out`, and optionally `files`.\n\
  \nGET /v1/stats/execution\n- Return 200 JSON with aggregated stats over all stored\
