  \ synthesis from 1 workflow-accepted self-reported-success source(s).\nSCBench execution_server\
  \ \u2014 Shared Implementation Playbook (Checkpoints 1\u20133)\n\nLanguage & Runtime\n\
  - Python 3 with FastAPI + uvicorn. Single entrypoint file named per `%%%ENTRYPOINT:entry_file%%%`.\n\
  \nCLI\n- Parse `--port` (int, default 8080) and `--address` (string, default `0.0.0.0`)\
  \ via `argparse`.\n- Launch with `uvicorn.run(app, host=args.address, port=args.port)`.\n\
  \nProtocol\n- HTTP/1.1, JSON request/response bodies, `Content-Type: application/json`.\n\
  \nIn-Memory State\n- Maintain a global list `execution_stats: List[float]` storing\
  \ raw duration seconds for every completed `POST /v1/execute` that returns 201.\n\
  \nPOST /v1/execute\n- Parse JSON body. Parse failure \u2192 400 `INVALID_JSON`.\n\
  - Body must be a dict. `command` required: non-empty string after stripping whitespace.\
  \ Missing/invalid \u2192 400 `MISSING_COMMAND`/`INVALID_COMMAND`.\n- `env` optional,\
