  \ `track: []` \u2192 no `files` key.\n- Verify directories in glob matches are skipped.\n\
  - Verify timeout process cleanup (no residual sleep processes).\n- Verify 400 errors:\
  \ missing command, invalid env/files/stdin/timeout/track types.\n"
