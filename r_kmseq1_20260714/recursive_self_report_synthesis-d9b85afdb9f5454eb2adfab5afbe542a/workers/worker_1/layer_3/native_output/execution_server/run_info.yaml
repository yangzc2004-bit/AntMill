  :null,\"max\":null,\"min\":null,\"stddev\":null}}`.\n- Else:\n  - `ran = len(durations)`.\n\
  \  - `average = round3(statistics.mean)`.\n  - `median = round3(statistics.median)`.\n\
  \  - `max = round3(max)`.\n  - `min = round3(min)`.\n  - `stddev`: if `n >= 2`,\
  \ `round3(statistics.stdev(durations))`; else `0.0` (then round3).\n\nError Response\
  \ Format (all non-2xx)\n- `{\"error\": \"human-readable message\", \"code\": \"\
  UPPER_SNAKE_MACHINE_CODE\"}`.\n\nEdge Cases & Constraints\n- `command` passed through\
  \ `shell=True`; do not split or validate beyond non-empty string.\n- Unicode preserved\
  \ via `text=True` and UTF-8 file writes/reads.\n- Working directory isolation per\
  \ run via `TemporaryDirectory`.\n- Process tree cleanup on timeout mandatory: `start_new_session=True`\
  \ enables `os.getpgid` for group kill.\n- `exit_code` for timeout exactly `-1`.\n\
  - `files` field omitted entirely when `track` absent or empty list.\n- Overlapping\
  \ globs deduplicated; no duplicate paths in `files`.\n- Directories matched by globs\
  \ skipped silently, not included in `files`.\n- Stdout/stderr empty strings are\
  \ `\"\"`, not null.\n- Rounding: Python built-in `round(x, 3)`; do not format to\
  \ string.\n\nValidation Procedures\n- Start server, verify checkpoint 1 examples:\
  \ echo, files+stdin, timeout (201 with exit_code -1, timed_out true), stats aggregation.\n\
